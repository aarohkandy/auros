<!doctype html><html><head><meta charset="utf-8"><title>Sky still</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<!-- website/tools/sky.html?t=120&scale=1&grain=0.03 renders one frame of the
     hero sky at full resolution; tools/stills.mjs screenshots it to make the
     still the page paints before WebGL starts. -->
<script src="../assets/aurora.js"></script>
<script>
var q = new URLSearchParams(location.search);
AurOSAurora.start(document.getElementById("c"), { still: true, force: true, time: +(q.get("t") || 120),
  scale: +(q.get("scale") || 1), grain: +(q.get("grain") || 0.03),
  onFirstFrame: function () { document.body.setAttribute("data-ready", "1"); } });
</script></body></html>
