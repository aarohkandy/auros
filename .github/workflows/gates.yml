# The gates, run on every push. A gate nobody runs is a gate that does not exist.
# This calls ./verify — the same entry point a developer runs locally — so "passes locally" and
# "passes in CI" cannot drift apart.
name: gates
on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable
      - name: Run every gate
        run: ./verify
